name: Deploy existing model image to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=9,<10" "httpx2>=2,<3"

      - name: Run tests
        run: python -m pytest -q

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: reliabilityml-ikhwan-2026
          workload_identity_provider: projects/940330321490/locations/global/workloadIdentityPools/reliabilityml-github/providers/github
          service_account: reliabilityml-deployer@reliabilityml-ikhwan-2026.iam.gserviceaccount.com

      - name: Deploy existing image
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: reliabilityml-ikhwan-2026
          region: asia-southeast1
          service: reliabilityml-api
          image: asia-southeast1-docker.pkg.dev/reliabilityml-ikhwan-2026/reliabilityml/reliabilityml-api:deploy-v2
          flags: >-
            --cpu=1 --memory=1Gi --min-instances=0 --max-instances=1
            --concurrency=1 --port=8000
            --service-account=reliabilityml-runtime@reliabilityml-ikhwan-2026.iam.gserviceaccount.com