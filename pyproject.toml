[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliabilityml"
version = "0.1.0"
description = "Remaining useful life learning project using NASA C-MAPSS FD001"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4,<3",
    "pandas>=3.0,<4",
    "PyYAML>=6,<7",
    "scikit-learn>=1.7,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]